# Generated by Wave 2 of the OSPS audit (osps-baseline-audit.md).
# Narrowed: only the `github-actions` ecosystem is scanned. All other manifests in this repo
# (package.json / go.mod / Dockerfile / pyproject.toml etc.) are synced from the
# michielvha/stackweaver monorepo and overwritten on every sync, so those dependencies are
# managed in the monorepo — scanning them here only produced PRs the sync clobbers.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions-non-security:
        applies-to: version-updates
        update-types: ["minor", "patch"]
